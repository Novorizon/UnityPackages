name: Verify Unity packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  managed-and-structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python3 tools/workspace.py verify
